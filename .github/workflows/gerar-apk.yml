name: Gerar APK UBETEC
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Dependencias
        run: npm ci || npm install
      - name: Preparar o projeto Android
        run: npx cap sync android
      - name: Compilar o APK
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Versao do app
        id: v
        run: |
          echo "nome=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)" >> "$GITHUB_OUTPUT"
          echo "codigo=$(grep -oP 'versionCode \K[0-9]+' android/app/build.gradle)" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/debug/app-debug.apk UBETEC.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UBETEC-apk
          path: UBETEC.apk
      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.nome }}-c${{ steps.v.outputs.codigo }}-b${{ github.run_number }}
          name: UBETEC ${{ steps.v.outputs.nome }} (build ${{ github.run_number }})
          body: ${{ github.event.head_commit.message || 'Nova versão do app UBETEC.' }}
          files: UBETEC.apk
          make_latest: true
