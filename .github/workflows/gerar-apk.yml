name: Gerar APK UBETEC
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Dependencias
        run: npm ci || npm install
      - name: Preparar o projeto Android
        run: npx cap sync android
      - name: Compilar o APK
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Nomear o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk UBETEC-1.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UBETEC-apk
          path: UBETEC-1.2.apk
      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2-build${{ github.run_number }}
          name: UBETEC 1.2 (build ${{ github.run_number }})
          body: "Baixe o UBETEC-1.2.apk e instale no celular Android."
          files: UBETEC-1.2.apk
