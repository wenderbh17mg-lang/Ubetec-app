# Gera o APK do app UBETEC no GitHub (sem Android Studio).
# Roda sozinho a cada envio de arquivos (push) e também pelo botão "Run workflow" na aba Actions.
# No fim: o APK fica em "Releases" (link direto, dá para abrir no celular) e em "Artifacts".
name: Gerar APK UBETEC
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Dependências
        run: npm ci || npm install
      - name: Preparar o projeto Android
        run: npx cap sync android
      - name: Compilar o APK
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Nomear o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk UBETEC-1.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UBETEC-apk
          path: UBETEC-1.2.apk
      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2-build${{ github.run_number }}
          name: UBETEC 1.2 (build ${{ github.run_number }})
          body: "Baixe o UBETEC-1.2.apk e instale no celular Android (permita instalar apps desta fonte)."
          files: UBETEC-1.2.apk
